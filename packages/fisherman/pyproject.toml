[project]
name = "fisherman"
version = "0.0.1"
authors = [{ name = "Quinn Joyce" }, { name = "Claude" }]
description = "Streamlit dashboard for managing hobbyist fishtank systems."
requires-python = ">=3.12"
dependencies = [
    "streamlit",
    "httpx",
    "click",
]

[project.scripts]
fisherman = "fisherman.cli:main"


## >> ---------------------------------------------------------------------------- >> ##
##                                     BUILD SYSTEM
## >> ---------------------------------------------------------------------------- >> ##
[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"
