[project]
name = "fisherman-bobber"
version = "0.0.1"
description = "Lightweight sensor client for Pi Zeros; reads a sensor and reports to net."
requires-python = ">=3.12"
dependencies = [
    "httpx",
]


## >> ---------------------------------------------------------------------------- >> ##
##                                     BUILD SYSTEM
## >> ---------------------------------------------------------------------------- >> ##
[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "bobber"
