name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fails on any lint violation (no --fix, so fixable issues still fail).
      - name: Ruff check
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock  # use the exact ruff version locked by uv
          args: "check --no-fix"

      # Fails if any file would be reformatted (does not modify files).
      - name: Ruff format
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock
          args: "format --check --diff"
